<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3F8FCB">
<title>Hero Tales</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hero Tales">
<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="story-page">

<div class="story-toolbar">
  <button class="tb-link" type="button" onclick="goBack('index.html')">← Back</button>
  <div class="tb-actions">
    <button id="voice-toggle" class="voice-toggle" type="button" title="Switch reading voice">🌐 Echo</button>
    <button id="campfire-toggle" class="campfire-btn" type="button" aria-pressed="false" title="Campfire mode — bigger text, fewer controls">🔥 Campfire</button>
    <a class="tb-link tb-home" href="index.html" title="Home">🏠</a>
  </div>
</div>

<main class="story-main">
  <article id="story" class="story">
    <div class="story-tradition" id="story-tradition"></div>
    <h1 id="story-title" class="story-title">Loading…</h1>
    <div id="story-meta" class="story-meta"></div>
    <div id="story-body" class="story-body"></div>
    <div class="story-source" id="story-source"></div>
  </article>

  <div class="story-controls">
    <button id="read-aloud" class="ctrl-btn primary" type="button">▶︎ Read aloud</button>
    <button id="another" class="ctrl-btn" type="button">Another tale</button>
    <button id="put-away" class="ctrl-btn ghost" type="button">Put away</button>
  </div>

  <div id="story-verdict" class="story-verdict" hidden>
    <p class="story-verdict-label">Does this match what you're after — bravery, courage, daring greatness?</p>
    <div class="story-verdict-buttons">
      <button id="vt-disapprove" class="ctrl-btn disapprove" type="button">✗ Disapprove</button>
      <button id="vt-approve" class="ctrl-btn approve" type="button">✓ Approve</button>
    </div>
  </div>
</main>

<div id="version-pill" class="version-pill"></div>
<div id="voice-toast" class="voice-toast" hidden></div>

<script src="assets/tts.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/story.js"></script>
</body>
</html>

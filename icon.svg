<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF6E4"/>
      <stop offset="100%" stop-color="#FAF6EC"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="flame2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- outer flame -->
  <path d="M256 96
           C 200 160 168 200 168 270
           C 168 350 210 410 256 416
           C 302 410 344 350 344 270
           C 344 200 312 160 256 96 Z"
        fill="url(#flame)"/>

  <!-- inner flame -->
  <path d="M256 168
           C 220 210 204 240 204 290
           C 204 340 230 380 256 384
           C 282 380 308 340 308 290
           C 308 240 292 210 256 168 Z"
        fill="url(#flame2)"/>

  <!-- hot core -->
  <ellipse cx="256" cy="320" rx="22" ry="36" fill="#FEF3C7" opacity="0.85"/>
</svg>
